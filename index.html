<!doctype html>
<html lang="en">
  <head>
    <script>
      // Gracefully silence Vite HMR WebSocket connection logs in sandbox iframes (HMR is disabled in preview)
      (function() {
        const origErr = console.error;
        console.error = function(...args) {
          const msg = args.map(a => String(a?.message || a || '')).join(' ');
          if (msg.toLowerCase().includes('websocket')) return;
          origErr.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.map(a => String(a?.message || a || '')).join(' ');
          if (msg.toLowerCase().includes('websocket')) return;
          origWarn.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          const str = String(event.reason?.message || event.reason?.stack || event.reason || '');
          if (str.toLowerCase().includes('websocket')) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          const str = String(event.message || event.error?.message || '');
          if (str.toLowerCase().includes('websocket')) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
